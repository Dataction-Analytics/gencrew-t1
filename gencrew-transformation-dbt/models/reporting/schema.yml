    description: "Fact from reservations. Grain: One row per reservation transaction"
    columns:
      - name: fact_reservations_key
        tests:
          - unique
          - not_null
      - name: dim_hotels_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_hotels')
              field: dim_hotels_key
      - name: dim_guests_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_guests')
              field: dim_guests_key
      - name: dim_channels_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_channels')
              field: dim_channels_key
      - name: dim_rate_plans_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_rate_plans')
              field: dim_rate_plans_key
  - name: fact_daily_hotel_performance
    description: "Fact from daily_hotel_performance. Grain: One row per hotel per business day"
    columns:
      - name: fact_daily_hotel_performance_key
        tests:
          - unique
          - not_null
      - name: dim_hotels_key
        tests:
