version: 2
models:
  - name: dim_hotels
    description: "Type-2 dimension from hotels; one row per version, natural key hotel_id; is_current marks the active version."
    columns:
      - name: dim_hotels_key
        tests:
          - unique
          - not_null
      - name: valid_from
        tests:
          - not_null
      - name: valid_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
  - name: dim_guests
    description: "Type-2 dimension from guests; one row per version, natural key guest_id; is_current marks the active version."
    columns:
      - name: dim_guests_key
        tests:
          - unique
          - not_null
      - name: valid_from
        tests:
          - not_null
      - name: valid_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
  - name: dim_channels
    description: "Type-2 dimension from channels; one row per version, natural key channel_id; is_current marks the active version."
    columns:
