              to: ref('dim_hotels')
              field: dim_hotels_key
  - name: fact_stay_nights
    description: "Fact from stay_nights. Grain: One row per room per night of stay"
    columns:
      - name: fact_stay_nights_key
        tests:
          - unique
          - not_null
      - name: dim_hotels_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_hotels')
              field: dim_hotels_key
      - name: dim_rooms_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_rooms')
              field: dim_rooms_key
      - name: dim_room_types_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_room_types')
              field: dim_room_types_key
  - name: fact_payments
    description: "Fact from payments. Grain: One row per payment transaction"
    columns:
      - name: fact_payments_key
        tests:
          - unique
          - not_null
  - name: fact_reviews
    description: "Fact from reviews. Grain: One row per review submission"
    columns:
      - name: fact_reviews_key
        tests:
          - unique
          - not_null
      - name: dim_hotels_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_hotels')
              field: dim_hotels_key
      - name: dim_guests_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_guests')
              field: dim_guests_key
