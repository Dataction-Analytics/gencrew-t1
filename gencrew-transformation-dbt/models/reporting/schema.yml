      - name: valid_from
        tests:
          - not_null
      - name: valid_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
  - name: dim_rate_plans
    description: "Type-2 dimension from rate_plans; one row per version, natural key rate_plan_id; is_current marks the active version."
    columns:
      - name: dim_rate_plans_key
        tests:
          - unique
          - not_null
      - name: valid_from
        tests:
          - not_null
      - name: valid_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
  - name: dim_room_types
    description: "Type-2 dimension from room_types; one row per version, natural key room_type_id; is_current marks the active version."
    columns:
      - name: dim_room_types_key
        tests:
          - unique
          - not_null
      - name: valid_from
        tests:
          - not_null
      - name: valid_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
  - name: dim_rooms
    description: "Type-2 dimension from rooms; one row per version, natural key room_id; is_current marks the active version."
    columns:
      - name: dim_rooms_key
        tests:
          - unique
          - not_null
      - name: valid_from
        tests:
          - not_null
      - name: valid_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
  - name: dim_loyalty_members
    description: "Type-2 dimension from loyalty_members; one row per version, natural key loyalty_id; is_current marks the active version."
    columns:
      - name: dim_loyalty_members_key
        tests:
          - unique
          - not_null
      - name: valid_from
        tests:
          - not_null
      - name: valid_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
