legends:
  model_role: fact = transactional/event data, dimension = master/reference data,
    bridge = many-to-many resolver
  evidence_refs: All IDs reference source catalog records (source:table_name) or requirement
    records (requirement:uuid)
  id_convention: Stable semantic identifiers using domain.concept pattern
  status_values:
    open: Ambiguity or missing decision blocks approval
    refuted: Evidence contradicts the stated requirement
    proposed: Item derived from evidence but requires business review
    not_in_data: Concept mentioned in requirements but not found in source
  attribute_types:
    key: Primary business identifier
    flag: Boolean indicator
    measure: Numeric measure or amount
    temporal: Date or timestamp attribute
    classifier: Categorical attribute referencing controlled vocabulary
    descriptor: Descriptive attribute
  crosswalk_scope: Table-level bindings establish grain and role; field-level bindings
    map keys and measured columns used in KPIs/rules
  kpi_implementation: Supported KPIs include table, expression/numerator/denominator,
    filter, grain and format. Unsupported KPIs have null implementation with explanation
    in question field
  rule_implementation: Transformation rules include kind (value_map, derive, filter,
    etc.), target column and expression. Missing source decisions leave implementation
    null
